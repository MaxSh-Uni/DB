{% extends "base.html" %}

{% block content %}
<h2>Login</h2>

<form method="post" class="mt-3" style="max-width: 400px;">
  <div class="mb-3">
    <label class="form-label">Username</label>
    <input
      type="text"
      name="username"
      class="form-control"
      required
    >
  </div>

  <button type="submit" class="btn btn-primary">
    Login
  </button>
</form>
{% endblock %}
