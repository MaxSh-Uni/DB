{% extends "base.html" %}
{% block content %}
<h2>Movies</h2>
<form method="get" class="mb-4">
  <label class="form-label">Sort by:</label>
  <select name="sort" class="form-select" onchange="this.form.submit()">
    <option value="">---</option>
    <option value="title" {% if sort == "title" %}selected{% endif %}>Title (A–Z)</option>
    <option value="year" {% if sort == "year" %}selected{% endif %}>Year (new first)</option>
    <option value="rating" {% if sort == "rating" %}selected{% endif %}>Rating (high first)</option>
  </select>
</form>
<div class="row">
  {% for movie in movies %}
  <div class="col-md-4 mb-3">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">{{ movie.title }} ({{ movie.year }}) ★{{ movie.rating }}</h5>
        <p class="card-text">{{ movie.genres | join(', ') }}</p>
        <a href="{{ url_for('movie_page', movie_id=movie._id) }}" class="btn btn-primary">Details</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
