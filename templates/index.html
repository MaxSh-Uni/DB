{% extends "base.html" %}
{% block title %}Movies{% endblock %}
{% block content %}
<h1>Movies</h1>

<div class="mb-3">
  <span>Sort by: </span>
  <a href="{{ url_for('index', sort='name') }}" class="btn btn-sm btn-outline-primary {% if sort_param=='name' %}active{% endif %}">Name</a>
  <a href="{{ url_for('index', sort='year') }}" class="btn btn-sm btn-outline-primary {% if sort_param=='year' %}active{% endif %}">Year</a>
  <a href="{{ url_for('index', sort='rating') }}" class="btn btn-sm btn-outline-primary {% if sort_param=='rating' %}active{% endif %}">Rating</a>
</div>

<div class="row">
  {% for movie in movies %}
  <div class="col-md-4 mb-3">
    <div class="card h-100">
      <div class="card-body">
        <h5 class="card-title">{{ movie.title }} ({{ movie.year }}) ★{{ movie.rating }}</h5>
        <p class="card-text">Director: {{ movie.director }}</p>
        <a href="{{ url_for('movie_detail', movie_id=movie._id|string) }}" class="btn btn-primary">View Details</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
